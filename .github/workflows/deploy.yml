name: Build & Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check prayer timezone regressions
        working-directory: ./frontend
        run: npm test

      - name: ⚛️ Build React Frontend
        working-directory: ./frontend
        run: npm run build

  deploy:
    name: Deploy to Live VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if [ -d "/var/www/quran_portal" ]; then
              cd /var/www/quran_portal
              chmod +x update_live.sh
              ./update_live.sh
            else
              echo "Directory /var/www/quran_portal not found. Run deploy_vps.sh first."
            fi
