# ==============================================================================
# Nginx Configuration for Maktab tul Muslim (Quran Portal)
# Production React SPA + Django REST API + Gunicorn
# Path on server: /etc/nginx/sites-available/quran_portal
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name maktabatulmuslim.com www.maktabatulmuslim.com _;

    # Maximum upload size for large media, MP3s, and books (up to 2.5 GB)
    client_max_body_size 2500M;
    client_body_timeout 1800s;
    client_header_timeout 1800s;

    # Gzip Compression for ultra-fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml font/woff font/woff2 application/font-woff;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Serve React Frontend Production Build
    location / {
        root /var/www/quran_portal/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets (Vite generates unique chunk hashes)
        location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|mp3|ogg|wav)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Do not cache index.html so users immediately get the latest release
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 2. Proxy Django REST API Requests
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 3. Proxy Django Admin Panel
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 4. Serve Django Static Files (Admin styles, icons, DRF browsable API)
    location /static/ {
        alias /var/www/quran_portal/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 5. Serve User Uploaded Media Files (Audio recitations, book PDFs, banners)
    location /media/ {
        alias /var/www/quran_portal/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
