<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full Square Dark Emerald Background Fill -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Inner Golden Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#goldGlow)"/>

  <!-- Outer Crescent Accent -->
  <path d="M 380,130 A 180,180 0 1,1 250,70 A 150,150 0 1,0 380,130 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Inner White Holy Quran Book Emblem -->
  <g transform="translate(116, 126)">
    <!-- Book Shadow -->
    <path d="M 20,40 C 90,20 140,40 140,40 L 140,230 C 140,230 90,210 20,230 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 260,40 C 190,20 140,40 140,40 L 140,230 C 140,230 190,210 260,230 Z" fill="#f8fafc" opacity="0.9"/>
    
    <!-- Left Page -->
    <path d="M 15,30 C 85,10 135,30 135,30 L 135,220 C 135,220 85,200 15,220 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Right Page -->
    <path d="M 265,30 C 195,10 145,30 145,30 L 145,220 C 145,220 195,200 265,220 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Gold Center Spine Marker -->
    <line x1="140" y1="25" x2="140" y2="230" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Decorative Arabic Calligraphy Lines on Book -->
    <line x1="45" y1="80" x2="105" y2="80" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <line x1="40" y1="120" x2="110" y2="120" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <line x1="45" y1="160" x2="105" y2="160" stroke="#059669" stroke-width="7" stroke-linecap="round"/>

    <line x1="175" y1="80" x2="235" y2="80" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <line x1="170" y1="120" x2="240" y2="120" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
    <line x1="175" y1="160" x2="235" y2="160" stroke="#059669" stroke-width="7" stroke-linecap="round"/>

    <!-- Star Emblem Center -->
    <polygon points="140,95 144,107 156,107 146,115 150,127 140,119 130,127 134,115 124,107 136,107" fill="url(#goldGrad)"/>
  </g>
</svg>
