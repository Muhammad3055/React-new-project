{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Quran Portal{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 4rem auto;">
  <div class="card auth-card">
    <div class="auth-header">
      <i class="fas fa-quran auth-icon"></i>
      <h2>Welcome Back</h2>
      <p>Sign in to your Quran Portal account</p>
    </div>
    
    <div class="card-body">
      <form method="POST" action="{% url 'login' %}" class="auth-form">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="id_username" class="form-label">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter username" required autofocus>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1.25rem;">
          <label for="id_password" class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter password" required>
          </div>
        </div>

        <button type="submit" class="btn-submit auth-btn" style="margin-top: 2rem;">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>
    </div>
    
    <div class="card-footer auth-footer" style="text-align: center; justify-content: center; padding: 1.5rem;">
      <p style="font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary-emerald); font-weight: 700;">Sign Up Here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
